#cloud-config
package_update: true
package_upgrade: true
packages:
  - fail2ban
  - nginx
  - unattended-upgrades

swap:
  filename: /swapfile
  size: 1G
  maxsize: 1G

write_files:
  - path: /etc/nginx/sites-available/what-is-life
    owner: root:root
    permissions: '0644'
    content: |
      server {
          listen 127.0.0.1:8080 default_server;
          server_name _;
          root /srv/what-is-life/current;
          index index.html;

          location = /index.html {
              add_header Cache-Control "no-store" always;
          }

          location ~* \.wasm$ {
              default_type application/wasm;
              add_header Cache-Control "public, max-age=31536000, immutable" always;
          }

          location / {
              try_files $uri $uri/ /index.html;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "no-referrer" always;
          }
      }
  - path: /srv/what-is-life/releases/bootstrap/index.html
    owner: root:www-data
    permissions: '0644'
    content: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>What Is Life test host</title>
        </head>
        <body>
          <main>
            <h1>What Is Life test host is ready.</h1>
            <p>No project build has been deployed yet.</p>
          </main>
        </body>
      </html>
  - path: /etc/fail2ban/jail.d/sshd.local
    owner: root:root
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
  - path: /etc/ssh/sshd_config.d/60-what-is-life.conf
    owner: root:root
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      AllowUsers __ADMIN_USERNAME__

runcmd:
  - [ln, -sfn, /srv/what-is-life/releases/bootstrap, /srv/what-is-life/current]
  - [chown, -R, __ADMIN_USERNAME__:www-data, /srv/what-is-life]
  - [rm, -f, /etc/nginx/sites-enabled/default]
  - [ln, -sfn, /etc/nginx/sites-available/what-is-life, /etc/nginx/sites-enabled/what-is-life]
  - [nginx, -t]
  - [systemctl, enable, --now, nginx]
  - [systemctl, reload, nginx]
  - [systemctl, enable, --now, fail2ban]
  - [sshd, -t]
  - [systemctl, reload, ssh]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, from, __MANAGEMENT_SOURCE_CIDR__, to, any, port, '22', proto, tcp]
  - [ufw, --force, enable]
  - [curl, --fail, --silent, --show-error, http://127.0.0.1:8080/]
